<a href="javascript:;" class="nav-link text-white p-0" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
    <div class="my-auto">
        <img src="./assets/img/logo.png" class="avatar avatar-sm  me-3 ">
        <b>{{user}}</b>
    </div>
</a>
<ul class="dropdown-menu  dropdown-menu-end  px-2 py-3 me-sm-n4" aria-labelledby="dropdownMenuButton">
    <li class="mb-2 px-3 py-2 border-bottom" *ngIf="sesion$ | async as s" style="cursor: pointer;" (click)="verDetallesSesion(s)">
        <div class="d-flex flex-column">
            <span class="text-xxs text-uppercase text-secondary font-weight-bold">Sesión (1 año)</span>
            <div class="d-flex align-items-center mt-1">
                <i class="far fa-clock text-info me-2"></i>
                <span class="text-xs font-weight-bold text-dark">{{ s.formatoCorto }}</span>
            </div>
            <span class="text-xxs text-muted mt-1">Expira: {{ s.fechaExpiracionTexto }}</span>
        </div>
    </li>
    <li class="mb-2" routerLink="perfil">
        <div class="d-flex py-1">
            &nbsp;
            <div class="d-flex flex-column justify-content-center">
                <h6 class="text-sm font-weight-normal mb-1">
                    <span class="font-weight-bold">Perfil</span>
                </h6>
            </div>
        </div>
    </li>
    <li class="mb-2" routerLink="buzon/vacaciones-autorizar">
        <div class="d-flex py-1">
            &nbsp;
            <div class="d-flex flex-column justify-content-center">
                <h6 class="text-sm font-weight-normal mb-1">
                    <span class="font-weight-bold"><i class="fas fa-tasks text-warning me-2"></i>Vacaciones por Autorizar</span>
                </h6>
            </div>
        </div>
    </li>
    <li class="mb-2" routerLink="buzon/notificaciones">
        <div class="d-flex py-1">
            &nbsp;
            <div class="d-flex flex-column justify-content-center">
                <h6 class="text-sm font-weight-normal mb-1">
                    <span class="font-weight-bold"><i class="fas fa-bell text-primary me-2"></i>Buzón de Notificaciones</span>
                </h6>
            </div>
        </div>
    </li>
    <li class="mb-2" routerLink="citas">
        <div class="d-flex py-1">
            &nbsp;
            <div class="d-flex flex-column justify-content-center">
                <h6 class="text-sm font-weight-normal mb-1">
                    <span class="font-weight-bold">citas</span>
                </h6>
            </div>
        </div>
    </li>
    <li class="mb-2" (click)="cerrarSesion();">
        <div class="d-flex py-1">
            &nbsp;
            <div class="d-flex flex-column justify-content-center">
                <h6 class="text-sm font-weight-normal mb-1">
                    <span class="font-weight-bold">Cerrar Sesion</span>
                </h6>
            </div>
        </div>
    </li>
</ul>
