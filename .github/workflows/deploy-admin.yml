name: Deploy Admin (Angular 17) to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-admin:
    name: Build & Deploy Admin (Producción)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SSH Secret
        run: |
          if [ -z "${{ secrets.HOSTINGER_SSH_PASSWORD }}" ] && [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ Falta configurar el secreto HOSTINGER_SSH_PASSWORD (o HOSTINGER_SSH_KEY) en GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build:prod

      - name: Package Dist Archive
        run: |
          cd dist/pedidos/browser
          tar -czf "$GITHUB_WORKSPACE/admin-dist.tar.gz" .

      - name: Ensure Target Directory Exists on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '31.170.166.250' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u740702945' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET="${{ secrets.ADMIN_TARGET_DIR || '/home/u740702945/domains/lumieresiga.com/public_html/nueva' }}"
            mkdir -p "$TARGET"

      - name: Upload Package Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '31.170.166.250' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u740702945' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          source: "admin-dist.tar.gz"
          target: "${{ secrets.ADMIN_TARGET_DIR || '/home/u740702945/domains/lumieresiga.com/public_html/nueva' }}"
          timeout: 180s

      - name: Extract Admin Safely Preserving Server Folders
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '31.170.166.250' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u740702945' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET="${{ secrets.ADMIN_TARGET_DIR || '/home/u740702945/domains/lumieresiga.com/public_html/nueva' }}"
            cd "$TARGET"
            echo "🔍 Limpiando archivos anteriores del Admin en $TARGET preservando subcarpetas protegidas..."

            # api es la API independiente, server, prueba, etc. NO deben tocarse
            PROTECTED_ITEMS=("api" "apip" "server" ".env" ".htaccess" "RESPALDO" "respaldo" "prueba" "act" "nueva" "licencias" ".well-known" "cgi-bin" "admin-dist.tar.gz")

            for item in * .*; do
              if [ "$item" = "." ] || [ "$item" = ".." ] || [ "$item" = "*" ] || [ "$item" = ".*" ]; then
                continue
              fi

              IS_PROTECTED=0
              for prot in "${PROTECTED_ITEMS[@]}"; do
                if [ "$item" = "$prot" ]; then
                  IS_PROTECTED=1
                  break
                fi
              done

              if [ $IS_PROTECTED -eq 1 ]; then
                echo "🛡️  Conservando elemento protegido: $item"
              else
                rm -rf "$item"
              fi
            done

            tar -xzf admin-dist.tar.gz
            rm -f admin-dist.tar.gz

            # Si Hostinger tiene además el subdominio configurado como domains/nueva.lumieresiga.com/public_html, sincronizar
            STANDALONE_DIR="/home/u740702945/domains/nueva.lumieresiga.com/public_html"
            if [ -d "$STANDALONE_DIR" ] && [ "$TARGET" != "$STANDALONE_DIR" ]; then
              echo "🔄 Sincronizando con $STANDALONE_DIR..."
              cp -r . "$STANDALONE_DIR/" 2>/dev/null || true
            fi

            php -r "if (function_exists('opcache_reset')) { opcache_reset(); }" || true
            echo "✅ ¡Admin desplegado con éxito en el subdominio nueva ($TARGET)!"
