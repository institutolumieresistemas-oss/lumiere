name: Deploy Web (Angular 20) to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-web:
    name: Build & Deploy Cursos Lumiere Web (Producción)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SSH Secret
        run: |
          if [ -z "${{ secrets.HOSTINGER_SSH_PASSWORD }}" ] && [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ Falta configurar el secreto HOSTINGER_SSH_PASSWORD (o HOSTINGER_SSH_KEY) en GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build:prod

      - name: Package Browser Build Contents
        run: |
          cd dist/web/browser
          tar -czf "$GITHUB_WORKSPACE/web-dist.tar.gz" .

      - name: Ensure Target Directory Exists on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '31.170.166.250' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u740702945' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET="${{ secrets.WEB_TARGET_DIR || '/home/u740702945/domains/cursoslumiere.com/public_html' }}"
            mkdir -p "$TARGET"

      - name: Upload Package Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '31.170.166.250' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u740702945' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          source: "web-dist.tar.gz"
          target: "${{ secrets.WEB_TARGET_DIR || '/home/u740702945/domains/cursoslumiere.com/public_html' }}"
          timeout: 180s

      - name: Extract Web Build Safely on Hostinger Preserving Subapps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '31.170.166.250' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u740702945' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET="${{ secrets.WEB_TARGET_DIR || '/home/u740702945/domains/cursoslumiere.com/public_html' }}"
            cd "$TARGET"
            echo "🔍 Limpiando archivos anteriores de Web preservando subaplicaciones (dashboard, etc.)..."

            # dashboard es la subapp independiente, quizes, app, etc. NO deben tocarse
            PROTECTED_ITEMS=("dashboard" "quizes" "prueba" "app" "licencias" "landing" ".htaccess" ".env" ".well-known" "cgi-bin" "web-dist.tar.gz")

            for item in * .*; do
              if [ "$item" = "." ] || [ "$item" = ".." ] || [ "$item" = "*" ] || [ "$item" = ".*" ]; then
                continue
              fi

              IS_PROTECTED=0
              for prot in "${PROTECTED_ITEMS[@]}"; do
                if [ "$item" = "$prot" ]; then
                  IS_PROTECTED=1
                  break
                fi
              done

              if [ $IS_PROTECTED -eq 1 ]; then
                echo "🛡️  Conservando subaplicación protegida: $item"
              else
                rm -rf "$item"
              fi
            done

            tar -xzf web-dist.tar.gz
            rm -f web-dist.tar.gz
            php -r "if (function_exists('opcache_reset')) { opcache_reset(); }" || true
            echo "✅ ¡Web Frontend desplegado con éxito en $TARGET!"
