name: Deploy Dashboard Builder (Angular 20) to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-dashboard:
    name: Build & Deploy Cursos Lumiere Dashboard (Producción)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SSH Secret
        run: |
          if [ -z "${{ secrets.HOSTINGER_SSH_PASSWORD }}" ] && [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ Falta configurar el secreto HOSTINGER_SSH_PASSWORD (o HOSTINGER_SSH_KEY) en GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build:prod

      - name: Package Browser Build Contents
        run: |
          cd dist/builder/browser
          tar -czf "$GITHUB_WORKSPACE/dashboard-dist.tar.gz" .

      - name: Ensure Target Directory Exists on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '31.170.166.250' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u740702945' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET="${{ secrets.DASHBOARD_TARGET_DIR || '/home/u740702945/domains/cursoslumiere.com/public_html/dashboard' }}"
            mkdir -p "$TARGET"

      - name: Upload Package Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '31.170.166.250' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u740702945' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          source: "dashboard-dist.tar.gz"
          target: "${{ secrets.DASHBOARD_TARGET_DIR || '/home/u740702945/domains/cursoslumiere.com/public_html/dashboard' }}"
          timeout: 180s

      - name: Extract Dashboard Build Safely on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '31.170.166.250' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u740702945' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET="${{ secrets.DASHBOARD_TARGET_DIR || '/home/u740702945/domains/cursoslumiere.com/public_html/dashboard' }}"
            cd "$TARGET"

            PROTECTED_ITEMS=(".htaccess" ".env" ".well-known" "cgi-bin" "dashboard-dist.tar.gz")

            for item in * .*; do
              if [ "$item" = "." ] || [ "$item" = ".." ] || [ "$item" = "*" ] || [ "$item" = ".*" ]; then
                continue
              fi

              IS_PROTECTED=0
              for prot in "${PROTECTED_ITEMS[@]}"; do
                if [ "$item" = "$prot" ]; then
                  IS_PROTECTED=1
                  break
                fi
              done

              if [ $IS_PROTECTED -eq 0 ]; then
                rm -rf "$item"
              fi
            done

            tar -xzf dashboard-dist.tar.gz
            rm -f dashboard-dist.tar.gz
            php -r "if (function_exists('opcache_reset')) { opcache_reset(); }" || true
            echo "✅ ¡Dashboard Builder desplegado con éxito en $TARGET!"
