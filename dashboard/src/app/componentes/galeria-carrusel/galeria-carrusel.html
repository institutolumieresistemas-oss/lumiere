<section class="galeria-carrusel-section py-4" style="position: relative;">
    <!-- Acciones del Componente -->
    <div class="galeria-actions">
        <button class="btn btn-sm btn-danger" (click)="eliminarElemento.emit()" title="Eliminar Galería">✖</button>
        <button class="btn btn-sm btn-success ms-2" (click)="agregarItem()" *ngIf="props.items.length < 10" title="Agregar Publicación">＋</button>
        <span class="badge bg-secondary ms-2">{{ props.items.length }}/10</span>
    </div>

    <div class="container">
        <!-- Título Editable Directamente -->
        <div class="text-center mb-4">
            <input type="text" [(ngModel)]="props.titulo" (blur)="actualizarProps.emit(props)" class="form-control title-input text-center mx-auto" placeholder="Escribe el título de la galería">
        </div>

        <!-- Mensaje si no hay publicaciones -->
        <div class="text-center py-5 text-muted border rounded-3 bg-light" *ngIf="props.items.length === 0">
            <i class="bi bi-instagram fs-1 d-block mb-2"></i>
            <p>No hay publicaciones en la galería. Haz clic en "＋" para agregar una.</p>
        </div>

        <!-- 🔥 Swiper Carousel con Autoplay -->
        <swiper-container *ngIf="props.items.length > 0" 
            slides-per-view="4" 
            space-between="20" 
            navigation="true" 
            pagination="true" 
            loop="true" 
            autoplay="true" 
            autoplay-delay="3000"
            autoplay-disable-on-interaction="false"
            breakpoints='{
                "0": { "slidesPerView": 1 },
                "576": { "slidesPerView": 2 },
                "992": { "slidesPerView": 3 },
                "1200": { "slidesPerView": 4 }
            }'>

            <swiper-slide *ngFor="let item of props.items; let i = index">
                <div class="instagram-card-wrapper position-relative">
                    
                    <!-- Acciones de edición rápida en el editor -->
                    <div class="item-actions">
                        <button class="btn btn-xs btn-primary me-1" (click)="abrirConfig(item, i)">⚙</button>
                        <button class="btn btn-xs btn-danger" (click)="eliminarItem(i)">✖</button>
                    </div>

                    <!-- Tarjeta estilo Instagram -->
                    <div class="instagram-card shadow-sm rounded-4 overflow-hidden bg-white border">
                        
                        <!-- Encabezado de la Tarjeta (Avatar + Nombre + Ubicación) -->
                        <div class="card-header-insta d-flex align-items-center p-3 border-bottom">
                            <div class="avatar-ring me-2.5">
                                <img [src]="item.avatar || 'https://i.pravatar.cc/150?img=33'" alt="Avatar" class="avatar-img rounded-circle">
                            </div>
                            <div class="user-info ms-2">
                                <h6 class="mb-0 fw-bold user-name text-truncate">{{ item.nombre }}</h6>
                                <small class="text-muted user-location text-truncate d-block">{{ item.ubicacion }}</small>
                            </div>
                        </div>

                        <!-- Imagen Principal -->
                        <div class="card-image-insta position-relative">
                            <img [src]="item.imagen || 'https://picsum.photos/400/400?random=1'" alt="Publicación" class="img-fluid w-100 object-fit-cover" style="aspect-ratio: 1/1; max-height: 280px;">
                        </div>

                        <!-- Acciones Sociales (Interactivo!) -->
                        <div class="card-actions-insta p-3 d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <button class="action-btn" (click)="toggleLike(item)" [class.liked]="item.liked">
                                    <i class="bi" [class.bi-heart-fill]="item.liked" [class.bi-heart]="!item.liked"></i>
                                </button>
                                <button class="action-btn"><i class="bi bi-chat"></i></button>
                                <button class="action-btn"><i class="bi bi-send"></i></button>
                            </div>
                            <button class="action-btn" (click)="toggleBookmark(item)" [class.bookmarked]="item.bookmarked">
                                <i class="bi" [class.bi-bookmark-fill]="item.bookmarked" [class.bi-bookmark]="!item.bookmarked"></i>
                            </button>
                        </div>

                    </div>
                </div>
            </swiper-slide>
        </swiper-container>
    </div>
</section>

<!-- MODAL CONFIGURACIÓN -->
<div *ngIf="configOpen" class="modal-config" (click)="cerrarConfig()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <h5 class="mb-3 fw-bold">Editar Publicación</h5>

        <div class="mb-3">
            <label class="form-label fw-bold">Nombre del Usuario</label>
            <input type="text" [(ngModel)]="itemSeleccionado.nombre" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Ubicación / Leyenda</label>
            <input type="text" [(ngModel)]="itemSeleccionado.ubicacion" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Foto de Perfil (Avatar)</label>
            <div class="alert alert-info py-1 px-2 mb-1 small d-flex align-items-center gap-1">
                <span>📐</span><span><strong>Recomendado:</strong> <code>150 × 150 px</code> — Cuadrada · JPG/WebP · Máx. 100 KB</span>
            </div>
            <input type="file" (change)="onFileChange($event, 'avatar')" class="form-control mb-2">
            <div *ngIf="itemSeleccionado.avatar" class="text-center mt-2">
                <img [src]="itemSeleccionado.avatar" alt="Avatar Preview" class="rounded-circle border" style="width: 50px; height: 50px; object-fit: cover;">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Foto de la Publicación</label>
            <div class="alert alert-info py-1 px-2 mb-1 small d-flex align-items-center gap-1">
                <span>📐</span><span><strong>Recomendado:</strong> <code>500 × 500 px</code> — Cuadrada · JPG/WebP · Máx. 300 KB</span>
            </div>
            <input type="file" (change)="onFileChange($event, 'imagen')" class="form-control mb-2">
            <div *ngIf="itemSeleccionado.imagen" class="text-center mt-2">
                <img [src]="itemSeleccionado.imagen" alt="Post Preview" class="img-fluid rounded border" style="max-height: 120px; object-fit: cover;">
            </div>
        </div>

        <div class="text-end mt-4">
            <button class="btn btn-success me-2" (click)="guardarConfig()">Guardar</button>
            <button class="btn btn-outline-secondary" (click)="cerrarConfig()">Cerrar</button>
        </div>
    </div>
</div>
