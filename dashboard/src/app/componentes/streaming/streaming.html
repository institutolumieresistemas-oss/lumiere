<div class="streaming-wrapper border rounded p-3 mb-3 bg-white shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="m-0 text-primary"><i class="bi bi-broadcast"></i> Configuración de Streaming</h6>
        <button class="btn btn-sm btn-outline-danger" (click)="eliminarElemento.emit()">Eliminar Bloque</button>
    </div>

    <div class="video-container mb-3 bg-black rounded overflow-hidden">
        <div data-vjs-player>
            <video #videoTarget class="video-js vjs-big-play-centered vjs-theme-city"></video>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <label class="form-label small fw-bold">URL del Stream (HLS .m3u8 / MP4)</label>
            <div class="input-group input-group-sm">
                <input type="text" class="form-control" [ngModel]="props.url" (ngModelChange)="updateUrl($event)" placeholder="https://ejemplo.com/live/archivo.m3u8">
                <span class="input-group-text bg-light text-success">
          <i class="bi bi-link-45deg"></i>
        </span>
            </div>
            <div class="form-text mt-1" style="font-size: 0.75rem;">
                Pega aquí el enlace de tu servidor de streaming o un video directo.
            </div>
        </div>
    </div>
</div>
