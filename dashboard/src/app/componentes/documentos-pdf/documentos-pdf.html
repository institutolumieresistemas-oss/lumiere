<section class="pdf-section position-relative py-5">

    <!-- ACCIONES DEL BUILDER -->
    <div class="pdf-actions d-flex gap-2">
        <button class="btn btn-sm btn-primary" (click)="abrirConfig()">⚙ Configurar</button>
        <button class="btn btn-sm btn-danger" (click)="eliminarElemento.emit()">✖ Eliminar</button>
    </div>

    <div class="container text-center">
        <h2 class="section-title mb-5 text-primary fw-bold">{{ props.tituloSeccion || 'Materiales y Guías de Estudio' }}</h2>
        
        <div class="row g-4 justify-content-center">
            
            <div class="col-12" 
                 [class.col-md-6]="props.columnas === 2"
                 [class.col-md-4]="props.columnas === 3"
                 [class.col-md-3]="props.columnas === 4"
                 *ngFor="let doc of props.documentos">
                 
                <div class="pdf-card p-4 h-100 d-flex flex-column justify-content-between rounded-4 shadow-sm" (click)="verPdf(doc.pdfUrl)">
                    <div class="pdf-icon mb-3">
                        <i class="fas fa-file-pdf text-danger display-4"></i>
                    </div>
                    <div class="pdf-info mb-3">
                        <h5 class="fw-bold mb-2 text-dark">{{ doc.titulo || 'Nombre del Documento' }}</h5>
                        <p class="text-muted small mb-0">{{ doc.descripcion || 'Descripción del archivo' }}</p>
                    </div>
                    <div class="pdf-button mt-auto">
                        <button class="btn btn-outline-danger w-100 rounded-pill btn-sm">
                            📖 Leer Documento
                        </button>
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</section>

<!-- MODAL CONFIGURACIÓN -->
<div *ngIf="configOpen" class="modal-config" (click)="cerrarConfig()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <h5 class="fw-bold mb-3">Configurar Visor de PDFs</h5>

        <label class="form-label small fw-bold">Título de la Sección</label>
        <input type="text" class="form-control mb-3" [(ngModel)]="tempProps.tituloSeccion">

        <label class="form-label small fw-bold">Columnas a Mostrar</label>
        <select class="form-select mb-3" [(ngModel)]="tempProps.columnas">
            <option [ngValue]="2">2 Columnas</option>
            <option [ngValue]="3">3 Columnas</option>
            <option [ngValue]="4">4 Columnas</option>
        </select>

        <h6 class="fw-bold mt-4 mb-2 text-start">Documentos PDF ({{ tempProps.documentos?.length }})</h6>
        <div class="document-list border rounded p-3 mb-3 bg-light" style="max-height: 300px; overflow-y: auto;">
            <div *ngFor="let doc of tempProps.documentos; let idx = index; trackBy: trackByFn" class="border-bottom pb-3 mb-3 text-start position-relative">
                <button class="btn btn-sm btn-danger position-absolute top-0 end-0" (click)="eliminarDocumento(idx)">Eliminar</button>
                
                <label class="small text-muted mt-2 d-block mb-1">Título del Documento</label>
                <input class="form-control form-control-sm mb-2" [(ngModel)]="doc.titulo">

                <label class="small text-muted d-block mb-1">Descripción Corta</label>
                <textarea class="form-control form-control-sm mb-2" [(ngModel)]="doc.descripcion" rows="2"></textarea>

                <label class="small text-muted d-block mb-1">Archivo PDF</label>
                <input type="file" accept="application/pdf" class="form-control form-control-sm mb-2" (change)="seleccionarPdf($event, idx)">
                <span class="text-success small" *ngIf="doc.pdfUrl">✓ PDF cargado correctamente</span>
                <span class="text-danger small" *ngIf="!doc.pdfUrl">⚠ Sin archivo PDF seleccionado</span>
            </div>
            
            <button class="btn btn-primary btn-sm w-100" (click)="agregarDocumento()">+ Agregar Documento</button>
        </div>

        <div class="text-end mt-4">
            <button class="btn btn-success me-2" (click)="guardarConfig()">Guardar</button>
            <button class="btn btn-outline-secondary" (click)="cerrarConfig()">Cerrar</button>
        </div>
    </div>
</div>
