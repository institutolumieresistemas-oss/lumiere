<section class="banner-descripcion-section position-relative" [class.gallery-right]="props.galleryPosition === 'right'" [attr.data-diseno]="props.diseno || 'playful'">
    
    <!-- ACCIONES DEL BUILDER -->
    <div class="banner-desc-actions d-flex gap-2">
        <button class="btn btn-sm btn-primary" (click)="abrirConfig()">⚙ Configurar</button>
        <button class="btn btn-sm btn-danger" (click)="eliminarElemento.emit()">✖ Eliminar</button>
    </div>

    <div class="container">
        <div class="row align-items-stretch g-5">
            
            <!-- COLUMNA GALERÍA -->
            <div class="col-12 col-md-6 order-1" [class.order-md-2]="props.galleryPosition === 'right'" [class.order-md-1]="props.galleryPosition !== 'right'">
                <div class="gallery-wrapper sketch-border">
                    <div class="tape-decor"></div>
                    <div class="gallery-slide" *ngFor="let img of props.galeria; let idx = index" [class.active]="idx === activeImageIndex">
                        <img [src]="img" alt="Foto Plantel">
                    </div>
                    <!-- Indicadores -->
                    <div class="gallery-dots" *ngIf="props.galeria && props.galeria.length > 1">
                        <span *ngFor="let img of props.galeria; let idx = index" 
                              class="dot" 
                              [class.active]="idx === activeImageIndex"
                              (click)="activeImageIndex = idx">
                        </span>
                    </div>
                </div>
            </div>

            <!-- COLUMNA INFORMACIÓN -->
            <div class="col-12 col-md-6 order-2 d-flex flex-column justify-content-center" [class.order-md-1]="props.galleryPosition === 'right'" [class.order-md-2]="props.galleryPosition !== 'right'">
                <div class="info-card">
                    <span class="badge-tag handwritten mb-2 d-inline-block">📍 Nuestro Plantel</span>
                    <h2 class="plantel-nombre text-primary">{{ props.nombre || 'Nombre del Plantel' }}</h2>
                    <p class="plantel-descripcion my-3 text-muted">{{ props.descripcion || 'Descripción del plantel' }}</p>
                    
                    <div class="detail-box p-3 rounded mb-4">
                        <div class="detail-item">
                            <span class="detail-icon">🏢</span>
                            <span class="detail-text ms-2"><strong>Dirección:</strong> {{ props.direccion || 'Dirección del plantel' }}</span>
                        </div>
                    </div>

                    <div class="map-action" *ngIf="props.mapaUrl">
                        <a [href]="props.mapaUrl" target="_blank" class="btn btn-mapa btn-primary w-100">
                            🗺️ Ver en Google Maps
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</section>

<!-- MODAL CONFIGURACIÓN -->
<div *ngIf="configOpen" class="modal-config" (click)="cerrarConfig()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <h5 class="fw-bold mb-3">Configurar Banner Plantel</h5>

        <!-- Nav Tabs -->
        <ul class="nav nav-tabs mb-4 d-flex">
            <li class="nav-item flex-fill text-center">
                <button type="button" class="nav-link w-100" [class.active]="activeTab === 'datos'" (click)="activeTab = 'datos'">
                    📝 Datos
                </button>
            </li>
            <li class="nav-item flex-fill text-center">
                <button type="button" class="nav-link w-100" [class.active]="activeTab === 'imagenes'" (click)="activeTab = 'imagenes'">
                    🖼️ Imágenes
                </button>
            </li>
        </ul>

        <!-- Contenedor Tab Datos -->
        <div *ngIf="activeTab === 'datos'">
            <label class="form-label small fw-bold">Diseño del Componente</label>
            <select class="form-select mb-3" [(ngModel)]="tempProps.diseno">
                <option value="playful">Divertido (Estudiantil)</option>
                <option value="serious">Institucional (Serio)</option>
                <option value="minimal">Minimalista (Limpio)</option>
                <option value="modern">Glow Moderno (Tecnológico)</option>
            </select>

            <label class="form-label small fw-bold">Nombre del Plantel</label>
            <input class="form-control mb-3" [(ngModel)]="tempProps.nombre">

            <label class="form-label small fw-bold">Descripción</label>
            <textarea rows="3" class="form-control mb-3" [(ngModel)]="tempProps.descripcion"></textarea>

            <label class="form-label small fw-bold">Dirección</label>
            <input class="form-control mb-3" [(ngModel)]="tempProps.direccion">

            <label class="form-label small fw-bold">Enlace del Mapa (Google Maps)</label>
            <input class="form-control mb-3" [(ngModel)]="tempProps.mapaUrl" placeholder="https://maps.google.com/...">

            <label class="form-label small fw-bold">Posición de la Galería</label>
            <div class="d-flex gap-2 mb-3">
                <button class="btn btn-sm" [class.btn-primary]="tempProps.galleryPosition === 'left'" [class.btn-outline-secondary]="tempProps.galleryPosition !== 'left'" (click)="cambiarPosicion('left')">Izquierda</button>
                <button class="btn btn-sm" [class.btn-primary]="tempProps.galleryPosition === 'right'" [class.btn-outline-secondary]="tempProps.galleryPosition !== 'right'" (click)="cambiarPosicion('right')">Derecha</button>
            </div>

            <label class="form-label small fw-bold">Intervalo de Autoreproducción (ms)</label>
            <input type="number" class="form-control mb-3" [(ngModel)]="tempProps.autoPlayInterval" placeholder="3000">
        </div>

        <!-- Contenedor Tab Imágenes -->
        <div *ngIf="activeTab === 'imagenes'">
            <label class="form-label small fw-bold mb-2">Galería de Imágenes ({{ tempProps.galeria?.length || 0 }})</label>
            
            <div class="gallery-grid mb-3">
                <!-- Imágenes existentes -->
                <div *ngFor="let img of tempProps.galeria; let idx = index; trackBy: trackByFn" class="gallery-grid-item">
                    <img [src]="img" alt="Imagen {{ idx + 1 }}">
                    <button type="button" class="btn-delete-img" (click)="eliminarImagen(idx)" title="Eliminar Imagen">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Cuadro punteado para Agregar Imagen -->
                <div class="dashed-upload-box" (click)="fileInput.click()">
                    <i class="fas fa-image"></i>
                    <span>+ Agregar Imagen</span>
                    <input type="file" #fileInput style="display: none;" accept="image/*" (change)="seleccionarImagen($event)">
                </div>
            </div>
        </div>

        <div class="text-end mt-4">
            <button class="btn btn-success me-2" (click)="guardarConfig()">Guardar</button>
            <button class="btn btn-outline-secondary" (click)="cerrarConfig()">Cerrar</button>
        </div>
    </div>
</div>
