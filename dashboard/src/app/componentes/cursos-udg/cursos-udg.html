<section class="section-padding courses-section position-relative">
  <!-- Acciones del Elemento (Eliminar y Editar) -->
  <div class="element-actions position-absolute top-0 end-0 m-3 z-3 d-flex gap-2">
    <button class="btn btn-primary btn-sm" (click)="editar = !editar">
      <i class="fas" [ngClass]="editar ? 'fa-eye' : 'fa-cog'"></i> {{ editar ? 'Ver Previsualización' : 'Configurar Sección' }}
    </button>
    <button class="btn btn-danger btn-sm" (click)="eliminarElemento.emit()">
      <i class="fas fa-trash-alt"></i> Eliminar
    </button>
  </div>

  <!-- Formulario de Edición -->
  <div *ngIf="editar" class="container edit-panel mb-4 p-4 border rounded shadow-sm bg-dark text-white">
    <h5 class="mb-3 text-warning"><i class="fas fa-edit me-2"></i>Editar Banner con Post-it</h5>
    
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label small text-muted">Título de la sección</label>
        <input type="text" class="form-control form-control-sm" [(ngModel)]="props.title">
      </div>
      <div class="col-md-6">
        <label class="form-label small text-muted">Subtítulo / Descripción</label>
        <input type="text" class="form-control form-control-sm" [(ngModel)]="props.subtitle">
      </div>

      <!-- Post-it Decorativo -->
      <div class="col-md-12 border-top border-secondary pt-3 mt-3">
        <h6 class="text-info small mb-2"><i class="fas fa-sticky-note me-1"></i>Nota Adhesiva (Post-it Rosa)</h6>
        <div class="row g-2">
          <div class="col-md-4">
            <label class="form-label small text-muted">Título de la nota</label>
            <input type="text" class="form-control form-control-sm" [(ngModel)]="props.stickyNoteTitle">
          </div>
          <div class="col-md-8">
            <label class="form-label small text-muted">Contenido de la nota (Dejar vacío para ocultar)</label>
            <input type="text" class="form-control form-control-sm" [(ngModel)]="props.stickyNoteText">
          </div>
        </div>
      </div>
    </div>

    <div class="mt-3 d-flex justify-content-end">
      <button class="btn btn-success btn-sm px-4" (click)="guardar()">
        <i class="fas fa-save me-1"></i> Guardar Cambios
      </button>
    </div>
  </div>

  <!-- Vista Previa -->
  <div class="container" [ngClass]="{ 'opacity-50': editar }">
    <div class="section-header text-center">
      <span class="badge">Nuestros Programas</span>
      <h2>{{ props.title }}</h2>
      <p>{{ props.subtitle }}</p>
    </div>

    <!-- Sticky Note Rosa -->
    <div class="d-flex justify-content-center" *ngIf="props.stickyNoteText">
      <div class="sticky-note sticky-pink" style="max-width: 280px; transform: rotate(-2deg); text-align: left;">
        <p class="handwritten" style="color: #0F2042; font-size: 1.25rem; font-weight: bold; margin-bottom: 5px;">{{ props.stickyNoteTitle }}</p>
        <p class="handwritten" style="font-size: 1.05rem; color: #BE185D; margin-bottom: 0;">{{ props.stickyNoteText }}</p>
      </div>
    </div>
  </div>
</section>
